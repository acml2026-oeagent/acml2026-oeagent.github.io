# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
name: OE-Agent @ ACML 2026
email: thai.le@deakin.edu.au
description: >
  Open and Efficient Agentic AI for Resource-Constrained Environments:
  Advancing Accessible AI Beyond Frontier Models — ACML 2026 Workshop.
footer_text: >
  Powered by <a href="http://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
url: https://acml2026-oeagent.github.io
baseurl:
last_updated:

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------
github_username: acml2026-oeagent
twitter_username:
linkedin_username:
scholar_userid:
orcid_id:
medium_username:
quora_username:

contact_note: >
  Questions about the workshop? Contact Hung Le at thai.le@deakin.edu.au.

google_analytics:

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------
blog_name: OE-Agent
blog_description: ACML 2026 Workshop on Open and Efficient Agentic AI.

# Pagination
paginate: 4
permalink: /news/:year/:title/
paginate_path: /news/page:num/

text:
  pagination:
    newer: 'Newer'
    older: 'Older'

# Comments
disqus_shortname:

# Optional features
show_social_icons: true
enable_anchorjs: false
enable_katex: true

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Build settings
markdown: kramdown
highlighter: pygments

# Includes & excludes
include: ['_pages']
exclude: [vendor]

# Plug-ins
plugins:
    - jekyll-email-protect
    - jekyll-paginate
    - jekyll/scholar
    - jemoji
    - jekyll-redirect-from

# Jekyll-Scholar
scholar:

  last_name:

  style: apa
  locale: en

  sort_by: year
  order: descending

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

# -----------------------------------------------------------------------------
# Other settings
# -----------------------------------------------------------------------------
jquery_version: "1.12.4"
katex_version: "0.9.0"
anchorjs_version: "3.2.2"
