<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="OE-Agent at ACML 2026: Open and Efficient Agentic AI for Resource-Constrained Environments">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#220a3a"/>
      <stop offset="0.55" stop-color="#160826"/>
      <stop offset="1" stop-color="#0a0416"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#B509AC" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#7a1a9e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7a1a9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.68" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#2698BA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2698BA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rightFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.3" stop-color="#0a0416" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0416" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f5"/>
      <stop offset="1" stop-color="#B509AC"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
  </g>

  <!-- agent network: a central hub orchestrating small, efficient agents -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#B509AC" stroke-opacity="0.55" stroke-width="2.4">
      <line x1="330" y1="315" x2="150" y2="185"/>
      <line x1="330" y1="315" x2="128" y2="375"/>
      <line x1="330" y1="315" x2="205" y2="500"/>
      <line x1="330" y1="315" x2="455" y2="160"/>
      <line x1="330" y1="315" x2="520" y2="450"/>
      <line x1="330" y1="315" x2="600" y2="290"/>
    </g>
    <g stroke="#2698BA" stroke-opacity="0.45" stroke-width="1.8">
      <line x1="150" y1="185" x2="42" y2="120"/>
      <line x1="205" y1="500" x2="62" y2="552"/>
      <line x1="520" y1="450" x2="648" y2="536"/>
      <line x1="600" y1="290" x2="690" y2="112"/>
      <line x1="455" y1="160" x2="536" y2="86"/>
      <line x1="600" y1="290" x2="520" y2="450"/>
    </g>
  </g>

  <g filter="url(#soft)" opacity="0.7">
    <circle cx="330" cy="315" r="30" fill="#B509AC"/>
    <circle cx="600" cy="290" r="12" fill="#2698BA"/>
    <circle cx="455" cy="160" r="11" fill="#11D68B"/>
  </g>

  <g>
    <circle cx="150" cy="185" r="13" fill="#e879f5"/>
    <circle cx="128" cy="375" r="11" fill="#e879f5"/>
    <circle cx="205" cy="500" r="12" fill="#c44fd6"/>
    <circle cx="455" cy="160" r="14" fill="#11D68B"/>
    <circle cx="520" cy="450" r="11" fill="#2698BA"/>
    <circle cx="600" cy="290" r="15" fill="#36b8d8"/>
    <circle cx="42"  cy="120" r="7"  fill="#9be7ff"/>
    <circle cx="62"  cy="552" r="7"  fill="#9be7ff"/>
    <circle cx="648" cy="536" r="7"  fill="#7af0c0"/>
    <circle cx="690" cy="112" r="8"  fill="#f0a3ec"/>
    <circle cx="536" cy="86"  r="6"  fill="#9be7ff"/>

    <circle cx="330" cy="315" r="40" fill="url(#hub)"/>
    <circle cx="330" cy="315" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.8"/>
    <circle cx="330" cy="315" r="56" fill="none" stroke="#e879f5" stroke-opacity="0.35" stroke-width="1.8"/>
    <circle cx="330" cy="315" r="72" fill="none" stroke="#e879f5" stroke-opacity="0.18" stroke-width="1.8"/>
  </g>

  <rect width="1200" height="630" fill="url(#rightFade)"/>

  <g text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="1120" y="238" font-size="104" font-weight="bold" letter-spacing="-2">OE-Agent</text>
    <text x="1120" y="296" font-size="38" font-weight="bold" fill="#e879f5" letter-spacing="1">ACML 2026 Workshop</text>
    <line x1="700" y1="336" x2="1120" y2="336" stroke="#e879f5" stroke-opacity="0.45" stroke-width="2"/>
    <text x="1120" y="392" font-size="33" fill-opacity="0.9">Open and Efficient Agentic AI for</text>
    <text x="1120" y="436" font-size="33" fill-opacity="0.9">Resource-Constrained Environments</text>
    <text x="1120" y="504" font-size="27" fill="#9be7ff">1 December 2026</text>
  </g>
</svg>