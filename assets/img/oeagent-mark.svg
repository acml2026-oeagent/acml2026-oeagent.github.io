<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="OE-Agent mark: a central hub orchestrating small agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c0d4a"/>
      <stop offset="1" stop-color="#0a0416"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#f5a8ff"/>
      <stop offset="1" stop-color="#B509AC"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- spokes -->
  <g stroke-linecap="round" fill="none" stroke="#e879f5" stroke-opacity="0.85" stroke-width="22">
    <line x1="256" y1="256" x2="128" y2="132"/>
    <line x1="256" y1="256" x2="392" y2="150"/>
    <line x1="256" y1="256" x2="150" y2="386"/>
  </g>
  <g stroke-linecap="round" fill="none" stroke="#2698BA" stroke-opacity="0.9" stroke-width="22">
    <line x1="256" y1="256" x2="386" y2="388"/>
  </g>

  <!-- satellite agents -->
  <circle cx="128" cy="132" r="46" fill="#e879f5"/>
  <circle cx="392" cy="150" r="42" fill="#11D68B"/>
  <circle cx="150" cy="386" r="42" fill="#c44fd6"/>
  <circle cx="386" cy="388" r="46" fill="#36b8d8"/>

  <!-- central orchestrator hub -->
  <circle cx="256" cy="256" r="96" fill="url(#hub)"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="10"/>
</svg>