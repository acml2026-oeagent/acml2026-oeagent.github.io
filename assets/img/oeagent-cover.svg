<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="OE-Agent: open and efficient multi-agent AI network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#220a3a"/>
      <stop offset="0.55" stop-color="#160826"/>
      <stop offset="1" stop-color="#0a0416"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#B509AC" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#7a1a9e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7a1a9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.7" cy="0.65" r="0.5">
      <stop offset="0" stop-color="#2698BA" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2698BA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rightFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#0a0416" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0416" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f5"/>
      <stop offset="1" stop-color="#B509AC"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#glow)"/>
  <rect width="1600" height="500" fill="url(#glow2)"/>

  <!-- faint structure lines: efficient / structured compute -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="1600" y2="125"/>
    <line x1="0" y1="250" x2="1600" y2="250"/>
    <line x1="0" y1="375" x2="1600" y2="375"/>
  </g>

  <!-- agent network: a central hub orchestrating small, efficient agents -->
  <g stroke-linecap="round" fill="none">
    <!-- edges -->
    <g stroke="#B509AC" stroke-opacity="0.55" stroke-width="2">
      <line x1="430" y1="250" x2="250" y2="140"/>
      <line x1="430" y1="250" x2="230" y2="300"/>
      <line x1="430" y1="250" x2="300" y2="400"/>
      <line x1="430" y1="250" x2="560" y2="120"/>
      <line x1="430" y1="250" x2="620" y2="360"/>
      <line x1="430" y1="250" x2="700" y2="230"/>
    </g>
    <g stroke="#2698BA" stroke-opacity="0.45" stroke-width="1.6">
      <line x1="250" y1="140" x2="120" y2="90"/>
      <line x1="300" y1="400" x2="160" y2="440"/>
      <line x1="620" y1="360" x2="760" y2="430"/>
      <line x1="700" y1="230" x2="860" y2="180"/>
      <line x1="560" y1="120" x2="640" y2="60"/>
      <line x1="700" y1="230" x2="620" y2="360"/>
    </g>
  </g>

  <!-- glowing nodes -->
  <g filter="url(#soft)" opacity="0.7">
    <circle cx="430" cy="250" r="26" fill="#B509AC"/>
    <circle cx="700" cy="230" r="10" fill="#2698BA"/>
    <circle cx="560" cy="120" r="9" fill="#11D68B"/>
  </g>

  <g>
    <!-- small efficient agents -->
    <circle cx="250" cy="140" r="11" fill="#e879f5"/>
    <circle cx="230" cy="300" r="9"  fill="#e879f5"/>
    <circle cx="300" cy="400" r="10" fill="#c44fd6"/>
    <circle cx="560" cy="120" r="12" fill="#11D68B"/>
    <circle cx="620" cy="360" r="9"  fill="#2698BA"/>
    <circle cx="700" cy="230" r="13" fill="#36b8d8"/>
    <circle cx="120" cy="90"  r="6"  fill="#9be7ff"/>
    <circle cx="160" cy="440" r="6"  fill="#9be7ff"/>
    <circle cx="760" cy="430" r="6"  fill="#7af0c0"/>
    <circle cx="860" cy="180" r="7"  fill="#f0a3ec"/>
    <circle cx="640" cy="60"  r="5"  fill="#9be7ff"/>

    <!-- central orchestrator hub -->
    <circle cx="430" cy="250" r="34" fill="url(#hub)"/>
    <circle cx="430" cy="250" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="430" cy="250" r="48" fill="none" stroke="#e879f5" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="430" cy="250" r="62" fill="none" stroke="#e879f5" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>

  <!-- darken right side so overlaid white title stays legible -->
  <rect width="1600" height="500" fill="url(#rightFade)"/>
</svg>
